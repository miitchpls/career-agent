[project]
name = "career-agent"
version = "0.1.0"
description = "Local job search over LinkedIn and Indeed, with a CV-based profile"
readme = "README.md"
authors = [
    { name = "miitchpls", email = "mitchgrek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "pypdf[crypto]>=7.1.1",
    "python-jobspy>=1.4.1,<1.5",  # boards.py uses LinkedIn._fetch_details (not public API)
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
career-agent = "career_agent:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]


[tool.ruff.lint.per-file-ignores]
# Pydantic models (through schema.Model, which ruff can't follow across modules): their
# list defaults are copied per instance, not shared.
"src/career_agent/profile.py" = ["RUF012"]
